<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMP更新工具</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-wrapper">
        <!-- 窗口标题栏 -->
        <div class="window-titlebar">
            <div class="window-title">
                <span class="app-name">TMP更新工具</span>
                <span class="version-badge" id="appVersion">v1.0.1</span>
            </div>
            <div class="window-controls">
                <button class="control-btn" id="btnMinimize" title="最小化">
                    <svg viewBox="0 0 12 12"><rect y="5" width="12" height="1.5" fill="currentColor"/></svg>
                </button>
                <button class="control-btn" id="btnMaximize" title="最大化">
                    <svg viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
                </button>
                <button class="control-btn close" id="btnClose" title="关闭">
                    <svg viewBox="0 0 12 12"><path d="M1 1L11 11M11 1L1 11" stroke="currentColor" stroke-width="1.5"/></svg>
                </button>
            </div>
        </div>

        <div class="main-content">
            <!-- 目录设置卡片 -->
            <div class="card slide-up">
                <div class="card-header">
                    <div class="card-title">
                        <span class="icon">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/>
                            </svg>
                        </span>
                        目录设置
                    </div>
                </div>

                <div class="directory-section">
                    <div class="directory-item">
                        <div class="directory-label">
                            <span class="dir-name">
                                <svg class="dir-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M20 6L9 17l-5-5"/>
                                </svg>
                                新版目录（用户目录）
                            </span>
                        </div>
                        <div class="directory-input-group">
                            <input
                                type="text"
                                id="newDirInput"
                                value=""
                                placeholder="将自动检测 TMP 目录路径"
                                readonly
                            />
                            <button class="btn-select" onclick="selectDirectory('new')">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/>
                                </svg>
                                选择
                            </button>
                        </div>
                    </div>

                    <div class="directory-item">
                        <div class="directory-label">
                            <span class="dir-name">
                                <svg class="dir-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                    <path d="M7 11V7a5 5 0 0110 0v4"/>
                                </svg>
                                旧版目录（系统目录）
                            </span>
                            <span class="badge old">需管理员</span>
                        </div>
                        <div class="directory-input-group">
                            <input
                                type="text"
                                id="oldDirInput"
                                value="C:\ProgramData\TruckersMP"
                                placeholder="请输入旧版目录路径"
                            />
                            <button class="btn-select" onclick="selectDirectory('old')">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/>
                                </svg>
                                选择
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 大型操作按钮卡片 -->
            <div class="action-cards slide-up">
                <button class="action-card action-card-new" id="btnUpdateNew">
                    <div class="action-card-icon">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                    </div>
                    <div class="action-card-content">
                        <div class="action-card-title">更新新版</div>
                        <div class="action-card-desc">自动获取并更新用户目录</div>
                    </div>
                    <div class="action-card-arrow">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6"/>
                        </svg>
                    </div>
                </button>

                <button class="action-card action-card-old" id="btnUpdateOld">
                    <div class="action-card-icon">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="23 4 23 10 17 10"/>
                            <path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/>
                        </svg>
                    </div>
                    <div class="action-card-content">
                        <div class="action-card-title">更新旧版</div>
                        <div class="action-card-desc">自动获取并更新系统目录</div>
                    </div>
                    <div class="action-card-arrow">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6"/>
                        </svg>
                    </div>
                </button>
            </div>

            <!-- 提示条（默认显示，更新时被状态消息替代） -->
            <div class="tips-bar">
                <div class="tip-item">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 12l2 2 4-4"/>
                        <circle cx="12" cy="12" r="10"/>
                    </svg>
                    MD5 校验，仅下载有差异的文件
                </div>
                <div class="tip-item">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0110 0v4"/>
                    </svg>
                    旧版目录需以管理员身份运行
                </div>
                <div class="tip-item">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="13 17 18 12 13 7"/>
                        <polyline points="6 17 11 12 6 7"/>
                    </svg>
                    点击按钮即开始自动更新
                </div>
            </div>

            <!-- 状态提示 -->
            <div id="statusMessage" class="alert-box" style="display: none;"></div>

            <!-- 进度条 -->
            <div id="progressSection" class="progress-section" style="display: none;">
                <div class="progress-header">
                    <span class="title">
                        <span class="progress-spinner"></span>
                        更新进度
                    </span>
                    <span class="progress-count" id="progressCount">0 / 0</span>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar-fill" id="progressBar" style="width: 0%"></div>
                </div>
                <div class="progress-footer">
                    <div id="currentFile" class="progress-status"></div>
                    <span class="percent" id="progressPercent">0%</span>
                </div>
            </div>

        </div>

        <!-- 底部版权 -->
        <div class="app-footer">
            <div class="footer-content">
                <div class="author">作者:Seven_TMP</div>
                <div class="thanks">特别鸣谢：备长炭提供接口</div>
            </div>
        </div>
    </div>

    <!-- 引入主应用脚本 -->
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
